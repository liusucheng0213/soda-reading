name: Encrypted Supabase backup

on:
  schedule:
    - cron: "40 16 * * *"
  workflow_dispatch:

concurrency:
  group: soda-database-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require a Supabase Postgres URL
        id: gate
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
        run: |
          case "$DATABASE_URL" in
            postgres://*|postgresql://*)
              if [ -z "$AGE_PUBLIC_KEY" ]; then
                echo "::warning::AGE_PUBLIC_KEY 为空，已跳过备份。"
                echo "ok=false" >> "$GITHUB_OUTPUT"
              else
                echo "ok=true" >> "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              echo "::warning::SUPABASE_DB_URL 不是 Postgres 连接串，已跳过加密备份。请换成 Supabase 的 Direct connection 或 Session pooler URI 后再手动运行。"
              echo "ok=false" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - name: Mark job start
        if: steps.gate.outputs.ok == 'true'
        run: date +%s > /tmp/soda-job-start
      - name: Install PostgreSQL client and age
        if: steps.gate.outputs.ok == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client age
      - name: Create and encrypt dump
        if: steps.gate.outputs.ok == 'true'
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
        run: |
          mkdir -p backup
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-acl --file=backup/soda-reading.dump
          age --recipient "$AGE_PUBLIC_KEY" --output backup/soda-reading.dump.age backup/soda-reading.dump
          rm backup/soda-reading.dump
          sha256sum backup/soda-reading.dump.age > backup/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.ok == 'true'
        with:
          name: soda-reading-backup-${{ github.run_id }}
          path: backup/
          retention-days: 14
          if-no-files-found: error
      - name: Record Action minutes
        if: steps.gate.outputs.ok == 'true'
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python -m pip install SQLAlchemy==2.0.36 psycopg2-binary==2.9.10
          STARTED=$(cat /tmp/soda-job-start)
          FINISHED=$(date +%s)
          MINUTES=$(python -c "print(round(($FINISHED-$STARTED)/60, 2))")
          python backend/scripts/record_platform_usage.py github_action_minutes "$MINUTES" '{"workflow":"encrypted-backup","runId":"${{ github.run_id }}"}'
