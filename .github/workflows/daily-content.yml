name: Daily learning content

on:
  schedule:
    # 21:17 Asia/Shanghai. GitHub may start scheduled jobs a little late.
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Caller idempotency id"
        required: false
        type: string
      limit:
        description: "Initial candidate target"
        required: false
        default: "500"
        type: string

concurrency:
  group: soda-daily-content
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-next-edition:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
      ZHIPU_MODEL: ${{ vars.ZHIPU_MODEL || 'glm-4.7-flash' }}
      MODELSCOPE_ACCESS_TOKEN: ${{ secrets.MODELSCOPE_ACCESS_TOKEN }}
      MODELSCOPE_MODEL: ${{ vars.MODELSCOPE_MODEL || 'Qwen/Qwen3.5-35B-A3B' }}
      SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
      SILICONFLOW_MODEL: ${{ vars.SILICONFLOW_MODEL || 'Qwen/Qwen2.5-7B-Instruct' }}
      EDITORIAL_PROVIDER_ORDER: zhipu,modelscope,siliconflow
      PAID_PROVIDER_ENABLED: "false"
      DAILY_PAID_BUDGET_CNY: "0"
      PAID_FALLBACK_MODE: never
      CONTENT_AUTO_PUBLISH: "true"
      CONTENT_DISCOVERY_MIN: "500"
      CONTENT_DISCOVERY_MAX: "2000"
      CONTENT_TARGET_CLUSTERS: "30"
      CONTENT_MAX_DAILY_VARIANTS: "12"
      CONTENT_PUBLISH_OFFSET_DAYS: "1"
      CONTENT_TIMEZONE: Asia/Shanghai
      CONTENT_RUN_LIMIT: ${{ inputs.limit || '500' }}
      CONTENT_CONTACT_EMAIL: ${{ vars.CONTENT_CONTACT_EMAIL }}

    steps:
      - uses: actions/checkout@v4
      - name: Mark job start
        run: date +%s > /tmp/soda-job-start
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pipeline dependencies
        run: pip install -r backend/requirements.txt
      - name: Verify zero-cost guard
        run: |
          python - <<'PY'
          import os
          assert os.environ["PAID_PROVIDER_ENABLED"].lower() == "false"
          assert float(os.environ["DAILY_PAID_BUDGET_CNY"]) == 0
          assert os.environ["PAID_FALLBACK_MODE"] == "never"
          print("zero-cost guard: active")
          PY
      - name: Generate and publish the next edition
        run: python backend/scripts/run_daily_content.py
      - name: Record Action minutes
        if: always()
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          STARTED=$(cat /tmp/soda-job-start)
          FINISHED=$(date +%s)
          MINUTES=$(python -c "print(round(($FINISHED-$STARTED)/60, 2))")
          python backend/scripts/record_platform_usage.py github_action_minutes "$MINUTES" '{"workflow":"daily-content","runId":"${{ github.run_id }}"}'
