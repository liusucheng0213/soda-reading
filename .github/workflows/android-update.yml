name: Android internal JS update

on:
  workflow_dispatch:
    inputs:
      message:
        description: "Update message"
        required: true
        default: "Internal improvements"
        type: string

concurrency:
  group: soda-android-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish-update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm run typecheck:mobile
      - name: Publish JS-only update
        working-directory: apps/mobile
        run: eas update --channel internal --message "${{ inputs.message }}" --non-interactive
