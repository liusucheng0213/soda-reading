project_id = "soda-reading-internal"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = ["http://localhost:4173", "sodareading://auth"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12

[auth.email]
# Keep the email/password provider enabled for synthetic internal addresses.
# Global auth.enable_signup=false above still blocks every public signup path.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.translate]
verify_jwt = true

[functions.daily-feed]
verify_jwt = true

[functions.change-password]
verify_jwt = true

[functions.admin-users]
verify_jwt = true

[functions.admin-reset-password]
verify_jwt = true

[functions.admin-content-run]
verify_jwt = true

[functions.admin-content-review]
verify_jwt = true

[analytics]
enabled = false
